name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})${{ matrix.extras && ' + llm extra' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One leg installs the light `llm` extra so the OpenRouter contract tests
          # run instead of skipping. The heavier `lexicon` extra stays out of CI.
          - python-version: "3.13"
            extras: "dev,llm"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install -e ".[${{ matrix.extras || 'dev' }}]"

      - name: Run test suite
        run: uv run python -m pytest -q --cov=src --cov-report=term-missing

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every step below is one arm of ./run.sh. The arms are defined once, in
# scripts/gate.py, and the same commands run locally; see docs/RUN_GUIDE.md.
# There is one environment per job (uv.lock, Python from .python-version) and
# no workspace step repeats a command another job already runs.
jobs:
  gate:
    timeout-minutes: 60
    name: gate (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python and uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.13"
          uv-version: "0.13.7"

      - name: Create the locked environment
        run: ./run.sh setup

      - name: Lint
        run: ./run.sh lint

      - name: Types
        run: ./run.sh types

      - name: Docs
        run: ./run.sh docs

      - name: Tests
        run: ./run.sh test

  gnn-conformance:
    timeout-minutes: 60
    # The gnn arm checks pin/pointer drift with the local reader, then checks
    # model agreement and pinned-parser/runtime identity. Shared-reader cutover
    # waits for its upstream release; keep this status-check context unchanged.
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python and uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.13"
          uv-version: "0.13.7"

      - name: Create the locked environment
        run: ./run.sh setup

      - name: Pinned GNN conformance
        run: ./run.sh gnn

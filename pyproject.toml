[project]
name = "cerebrum"
version = "1.5.0"
description = "CEREBRUM: Case-Enabled Reasoning Engine with Bayesian Representations for Unified Modeling"
readme = "README.md"
license = {text = "CC BY 4.0"}
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
keywords = ["active-inference", "cognitive-modeling", "bayesian", "case-based-reasoning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "matplotlib>=3.10.9",
    "imageio>=2.38.0",
    "networkx>=3.4.2",
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-html>=4.2.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.168.5",
    "black>=26.10.1",
    "flake8>=7.4.1",
    "mypy>=2.4.1",
    "isort>=9.0.2",
    "pre-commit>=4.6.2",
]
lexicon = [
    "spacy>=3.8.18",
    "plotly>=7.1.0",
    "imageio>=2.38.0",
    "psutil>=7.2.2",
    "networkx>=3.4.2",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
]
torch = [
    "torch>=2.14.1",
]
llm = [
    "aiohttp>=3.14.5",
    "openai>=3.41.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]
all = [
    "cerebrum[dev,lexicon,llm,torch]",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/CEREBRUM"
Documentation = "https://github.com/ActiveInferenceInstitute/CEREBRUM/tree/main/docs"
Repository = "https://github.com/ActiveInferenceInstitute/CEREBRUM.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
